services:
  php-api-test:
    image: wms-php-app:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./php:/var/www/php
      - ./database:/var/www/database
    working_dir: /var/www/php
    ports:
      - "127.0.0.1:${BRUNO_PHP_PORT:-28081}:80"
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: database_bruno_php
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

  java-api-test:
    image: wms-java-app:latest
    build:
      context: .
      dockerfile: docker/java/Dockerfile
    volumes:
      - ./java:/app
    working_dir: /app
    ports:
      - "127.0.0.1:${BRUNO_JAVA_PORT:-28082}:8080"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://database:5432/database_bruno_java
